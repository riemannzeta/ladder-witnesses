[project]
name = "ladder-witnesses"
version = "0.1.0"
description = "Witness-pair experiments on Pearl's causal ladder: can a small transformer answer interventional and counterfactual queries when given exactly the information the Causal Hierarchy Theorem says is necessary?"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Frank Martin" }]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "networkx>=3.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["witnesses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
