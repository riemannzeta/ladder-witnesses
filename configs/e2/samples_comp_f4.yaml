# POST-HOC exploratory arm (PREDICTIONS.md, Addendum 3): E2-full trained with a 25% share of
# queries whose two slots are BOTH effective (same PAIRS rule as configs/e2/cpt_comp_f4.yaml).
# Everything else, including the frozen eval splits, is identical to samples_f4.yaml.
exp: e2
condition: samples_f4_comp25
task: e2_dags
task_args: {mode: samples, fold: 4, n_samples: 128, p_cond: 0.5, p_inert: 0.5, mc: 2048, n_eval_per_split: 1000, p_composite_train: 0.25}
model: {d_model: 256, n_layers: 6, n_heads: 8}
smoke_model: {d_model: 64, n_layers: 2, n_heads: 4}
optim: {lr: 3.0e-4, batch_size: 256}
schedule: {base_steps: 60000, min_steps: 20000, eval_every: 2000}
